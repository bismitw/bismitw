<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 250" width="490" height="250">
<style>
  .term { font-family: "Courier New", monospace; font-size: 14px; }
  .title { fill: #58a6ff; font-weight: bold; }
  .sep { fill: #8b949e; }
  .label { fill: #3fb950; font-weight: bold; }
  .val { fill: #8b949e; }
</style>
<rect width="490" height="250" fill="transparent" />
<g opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="0.0s" dur="0.3s" fill="freeze" />
  <text x="20" y="40" class="term title">bismit@github</text>
</g>
<g opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="0.15s" dur="0.3s" fill="freeze" />
  <text x="20" y="66" class="term sep">------------</text>
</g>
<g opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.3s" fill="freeze" />
  <text x="20" y="92" class="term label">Role</text>
  <text x="100" y="92" class="term val">Software Engineer</text>
</g>
<g opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="0.44999999999999996s" dur="0.3s" fill="freeze" />
  <text x="20" y="118" class="term label">Focus</text>
  <text x="100" y="118" class="term val">Backend Engineering, Artificial Intelligence and Machine Learning</text>
</g>
<g opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.3s" fill="freeze" />
  <text x="20" y="144" class="term label">Languages</text>
  <text x="100" y="144" class="term val">Python, JavaScript, TypeScript</text>
</g>
<g opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="0.75s" dur="0.3s" fill="freeze" />
  <text x="20" y="170" class="term label">Goals</text>
  <text x="100" y="170" class="term val">AI/ML Engineer</text>
</g>
</svg>